[project]
name = "scholia"
version = "0.1.1"
description = "A marking aid library"
readme = "README.md"
authors = [
    { name = "Vince Knight", email = "vince@pryther.ch" },
]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "pyyaml>=6.0",
    "matplotlib>=3.10",
    "charset-normalizer>=3.4.7",
]

[project.scripts]
scholia = "scholia.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "zensical",
    "mkdocstrings[python]>=1.0.3",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "ty>=0.0.21",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short --cov=scholia --cov-fail-under=100 --cov-report=term-missing"
